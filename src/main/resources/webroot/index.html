<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MicroSpringBoot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1   { color: #333; }
        img  { max-width: 300px; margin: 20px 0; display: block; }
        ul li { margin: 8px 0; }
        a    { color: #0077cc; }
    </style>
</head>
<body>
<h1>MicroSpringBoot Framework</h1>

<img src="/img/tierra.png" alt="Logo del servidor">

<p>Servidor web basado en reflexión de Java.</p>

<h2>Endpoints disponibles</h2>
<ul>
    <li><a href="/">/  → Greetings from Spring Boot!</a></li>
    <li><a href="/hello">/hello → Hello World!</a></li>
    <li><a href="/pi">/pi → valor de PI</a></li>
    <li><a href="/greeting?name=Samuel">/greeting?name=Samuel → Hola Samuel</a></li>
</ul>
</body>
</html>
